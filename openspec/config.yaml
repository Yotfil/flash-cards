schema: spec-driven

# Contexto del proyecto: se muestra a la IA al generar artefactos (proposal, design, specs, tasks).
context: |
  Proyecto: flash-cards — PWA de repetición espaciada, materia-agnóstica (primer caso: vocabulario
  de inglés), abrible en móvil y escritorio, online y offline. Reescritura desde cero guiada por
  specs (SDD con OpenSpec) y TDD. Las reglas de ingeniería completas viven en CLAUDE.md (raíz) y la
  especificación de producto en docs/especificacion-anki-mejorada.md.

  Stack: Angular (standalone, PWA) · TypeScript strict · Tailwind con tokens semánticos · ts-fsrs
  (no reimplementar algoritmos) · Firebase (Firestore + Auth + Hosting/Netlify) · Zod en la
  frontera · ESLint + Prettier · Node 24.17 (nvm).

  Arquitectura por capas (Ports & Adapters): UI (solo pinta) → servicios (lógica pura) →
  repositorios (única capa que habla con el almacén). ts-fsrs y Firestore son adaptadores detrás
  de interfaces. Todo componente Angular vive en su carpeta con 4 archivos (.ts/.html/.scss/.spec.ts).

  Principios: materia-agnóstico (anverso/reverso genérico, nunca palabra/traducción) · esquema listo,
  UI después · costo-consciencia (nada de pago por uso en fases tempranas) · diseñar para la
  extensión (datos privados bajo /users/{uid}) · calidad mantenible (legible por un junior).

  Idioma: todos los artefactos (specs, proposals, designs, tasks, commits) se escriben en español.
  Las specs describen comportamiento observable: nunca nombres de clases, archivos ni librerías.

  Git: ramas feature/<kebab> sacadas de dev; Claude hace push y entrega el link de comparación;
  el usuario crea y mergea el PR hacia dev. Commits atómicos sin trailer Co-Authored-By de Claude.

rules:
  proposal:
    - Escribir en español, breve (menos de 500 palabras), con sección "Fuera de alcance"
    - Indicar qué spec base de openspec/specs/ se está implementando o modificando
  design:
    - Respetar las capas (UI / servicios / repositorios) y nombrar en qué capa cae cada pieza
    - Justificar cualquier abstracción nueva con el segundo caso de uso real que la pide
  specs:
    - Formato del piloto openspec/specs/cola-diaria/spec.md (SHALL + escenarios WHEN/THEN)
    - Comportamiento observable, sin nombres de clases, archivos ni librerías
  tasks:
    - Orden TDD: cada tarea de código va precedida por la tarea de escribir su test en rojo
    - Empezar por el "cerebro" (servicios puros) y terminar por la UI
    - Tareas pequeñas (menos de 2 horas), una por commit atómico

operations:
  apply:
    guidance:
      - Usar la skill tdd (rojo → verde → refactor) para cada tarea de código
      - Ejecutar lint, tsc y la suite completa antes de marcar una tarea como hecha
  archive:
    guidance:
      - Verificar que las specs base en openspec/specs/ quedaron sincronizadas con el delta
      - Anotar el cierre en MEMORY.md (bitácora del repo)
