# Integración continua mínima (ADR 0002): los mismos comandos que se corren en local, en cada
# PR hacia dev y main y en cada push a dev. Un solo job; el despliegue lo hace Netlify al mergear.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

# Un push nuevo cancela la corrida anterior SOLO en PRs (validar un commit ya superado no aporta).
# En dev y main cada commit integrado se valida de principio a fin.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# La CI solo lee el código: su token no puede escribir en el repositorio. Las acciones van por
# etiqueta (no por SHA): son oficiales de GitHub y, con este permiso, no pueden escribir aunque
# una etiqueta cambiara (decidido el 2026-10-26).
permissions:
  contents: read

jobs:
  verify:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-24.04 # fijo, no 'latest': reproducible aunque GitHub cambie la imagen
    timeout-minutes: 20
    steps:
      - name: Código
        uses: actions/checkout@v5

      - name: Node (versión de .nvmrc)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Java 21 (emulador de Firestore)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas unitarias
        run: npm test

      - name: Pruebas de integración (emulador de Firestore)
        run: npm run test:integration

      - name: Build de producción
        run: npm run build
