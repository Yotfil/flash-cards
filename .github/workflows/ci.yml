# Integración continua mínima (ADR 0002): los mismos comandos que se corren en local, en cada
# PR hacia dev y main y en cada push a dev. Un solo job; el despliegue lo hace Netlify al mergear.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Código
        uses: actions/checkout@v4

      - name: Node (versión de .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Java 21 (emulador de Firestore)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas unitarias
        run: npm test

      - name: Pruebas de integración (emulador de Firestore)
        run: npm run test:integration

      - name: Build de producción
        run: npm run build
