<div
  data-card-row
  class="glass-soft flex items-center gap-2 rounded-2xl p-2 pr-3"
  [class.dimmed]="suspension.value()"
  [attr.aria-busy]="suspension.saving() ? 'true' : null"
>
  @if (selectionMode()) {
    <input
      type="checkbox"
      class="ml-2 size-5 shrink-0 accent-accent"
      [checked]="selected()"
      [attr.aria-label]="copy.selectOf(name())"
      (change)="toggleSelect.emit()"
    />
  }

  <button
    type="button"
    data-card-body
    class="press flex min-w-0 flex-1 flex-col items-start gap-1.5 rounded-xl p-2 text-left"
    (click)="openBody()"
  >
    <span class="block w-full truncate text-text">
      @if (isCloze()) {
        {{ name() }}
      } @else {
        <span class="font-bold">{{ card().front }}</span>
        <span class="text-text-faint"> {{ copy.arrow }} </span>
        <span class="text-text-dim">{{ card().back }}</span>
      }
    </span>

    @if (isCloze() || isDuplicate() || suspension.value() || card().example) {
      <span class="flex flex-wrap items-center gap-1.5 text-xs font-semibold text-text-dim">
        @if (isCloze()) {
          <span class="rounded-md bg-accent-tint px-1.5 py-0.5 text-accent-text">
            {{ copy.cloze }}
          </span>
        }
        @if (isDuplicate()) {
          <span class="flex items-center gap-1 rounded-md border border-glass-border px-1.5 py-0.5">
            <app-icon name="alert" size="sm" />
            <span class="sr-only">{{ copy.duplicateLabel }}</span>
            <span aria-hidden="true">{{ copy.duplicate }}</span>
          </span>
        }
        @if (suspension.value()) {
          <span class="rounded-md border border-glass-border px-1.5 py-0.5">
            {{ copy.suspended }}
          </span>
        }
        @if (card().example) {
          <span
            role="img"
            class="text-text-faint"
            [attr.aria-label]="copy.hasExample"
            [title]="copy.hasExample"
          >
            <app-icon name="quote" size="sm" />
          </span>
        }
      </span>
    }
  </button>

  @if (!selectionMode()) {
    <app-action-menu
      [label]="copy.actionsOf(name())"
      [items]="menuItems()"
      [disabled]="!online() || suspension.saving()"
      (selected)="runAction($event)"
    />
  }
</div>

@if (suspension.error(); as error) {
  <p role="alert" class="px-3 pt-1.5 text-xs text-danger">{{ error }}</p>
}
