<h2 class="text-lg font-bold tracking-tight text-text">{{ title }}</h2>

<div class="mt-3">
  @if (loaded()) {
    <p data-export-summary class="text-sm text-text-dim">{{ summary() }}</p>
  } @else if (readFailed()) {
    <app-error-state [compact]="true" [title]="readError" (retry)="retry()" />
  } @else {
    <app-skeleton [lines]="1" />
  }
</div>

@if (errorMessage(); as message) {
  <p role="alert" class="mt-3 text-sm text-danger">{{ message }}</p>
}

<div class="mt-6 flex flex-wrap items-center gap-2">
  @if (!readFailed()) {
    <button
      type="button"
      class="press rounded-xl px-1 py-2.5 text-sm font-semibold text-accent-text disabled:opacity-50"
      [disabled]="!canDeliver()"
      (click)="copyText()"
    >
      {{ actions.copy }}
    </button>
    <span role="status" class="text-sm text-text-dim">
      @if (copied()) {
        {{ copiedText }}
      }
    </span>
  }
  <div class="ms-auto flex gap-2">
    <button
      type="button"
      class="press rounded-xl border border-glass-border px-4 py-2.5 text-sm font-semibold text-text disabled:opacity-50"
      [disabled]="busy()"
      (click)="cancel()"
    >
      {{ actions.cancel }}
    </button>
    @if (!readFailed()) {
      <button
        type="button"
        class="press rounded-xl bg-accent px-4 py-2.5 text-sm font-semibold text-accent-ink disabled:opacity-50"
        [disabled]="!canDeliver()"
        (click)="deliver()"
      >
        {{ canShare ? actions.share : actions.download }}
      </button>
    }
  </div>
</div>
