<div class="glass-soft flex items-center gap-2 rounded-2xl p-2 pr-3">
  <a
    class="press flex min-w-0 flex-1 items-center gap-3 rounded-xl p-2"
    [routerLink]="['/biblioteca', bookId(), chapter().id]"
  >
    <span
      class="grid size-9 shrink-0 place-items-center rounded-lg bg-accent-tint text-sm font-bold text-accent-text"
    >
      {{ position() }}
    </span>
    <span class="min-w-0 flex-1">
      <span class="block truncate font-bold text-text">{{ name() }}</span>
      @if (cardCount.hasValue() && cardCount.value() !== undefined) {
        <span class="mt-0.5 block text-xs text-text-faint">
          {{ copy.cards(cardCount.value() ?? 0) }}
        </span>
      }
    </span>
  </a>
  <button
    type="button"
    class="press grid size-10 place-items-center rounded-xl text-text-faint hover:text-text"
    [attr.aria-label]="copy.chapters.renameOf(name())"
    (click)="renameRequested.emit()"
  >
    <app-icon name="edit" />
  </button>
  <button
    type="button"
    class="press grid size-10 place-items-center rounded-xl text-text-faint hover:text-text"
    [attr.aria-label]="copy.chapters.deleteOf(name())"
    (click)="deleteRequested.emit()"
  >
    <app-icon name="trash" />
  </button>
</div>
