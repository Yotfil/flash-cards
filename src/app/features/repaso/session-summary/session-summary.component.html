<section class="mx-auto flex w-full max-w-md flex-col items-center gap-6 text-center">
  <div class="relative grid size-28 place-items-center" aria-hidden="true">
    <svg viewBox="0 0 120 120" class="size-28 -rotate-90">
      <circle cx="60" cy="60" r="52" class="ring-track" />
      <circle cx="60" cy="60" r="52" class="ring-progress" pathLength="100" />
    </svg>
    <app-icon name="check" class="check absolute text-accent-text" />
  </div>

  <div class="flex flex-col gap-1.5">
    <h1 class="text-2xl font-extrabold tracking-tight text-text">{{ copy.summaryTitle }}</h1>
    <p class="text-text-dim">{{ reviewedText() }}</p>
  </div>

  <ul class="flex flex-wrap justify-center gap-2" [attr.aria-label]="copy.ratingCountsLabel">
    @for (pill of pills(); track pill.rating) {
      <li
        data-rating-count
        class="flex items-center gap-1.5 rounded-full border border-glass-border bg-surface px-3 py-1 text-sm text-text-dim"
      >
        <span class="size-2 rounded-full" [class]="pill.dotClass" aria-hidden="true"></span>
        {{ pill.label }}
        <b class="font-bold text-text">{{ pill.count }}</b>
      </li>
    }
  </ul>

  <p class="text-sm text-text-faint">{{ copy.summaryNote }}</p>

  @if (rejectedText(); as rejected) {
    <p role="alert" class="text-sm text-danger">{{ rejected }}</p>
  }

  <ng-content select="[practice]" />

  <button
    type="button"
    class="press rounded-xl bg-accent px-6 py-3 text-sm font-semibold text-accent-ink shadow-btn"
    (click)="homeRequested.emit()"
  >
    {{ copy.backToToday }}
  </button>
</section>
