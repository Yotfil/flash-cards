<div class="flex flex-col gap-3 rounded-2xl border border-glass-border bg-surface p-4">
  <p aria-live="polite" class="font-bold text-text">{{ counts() }}</p>
  @if (preview().repeatedCount > 0) {
    <p class="text-sm text-text-dim">{{ wording().repeatedNote }}</p>
  }
  @if (omitted().length > 0) {
    <div class="flex flex-col gap-2">
      <p class="text-sm font-semibold text-text-dim">{{ omittedTitle() }}</p>
      <ul
        data-omitted-list
        class="flex max-h-60 flex-col gap-1.5 overflow-y-auto text-sm text-text-dim"
      >
        @for (line of omitted(); track $index) {
          <li class="flex items-start gap-2">
            <app-icon name="alert" size="sm" class="mt-0.5 text-text-faint" />
            {{ line }}
          </li>
        }
        @if (omittedMore(); as more) {
          <li class="ps-6">{{ more }}</li>
        }
      </ul>
    </div>
  }
</div>
