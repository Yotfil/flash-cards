<section
  class="flex flex-col items-center gap-3 rounded-3xl border border-glass-border bg-surface px-6 py-10 text-center shadow-card"
>
  <span class="grid size-14 place-items-center rounded-full bg-accent-tint text-accent-text">
    <app-icon name="check" />
  </span>
  <h1 class="text-2xl font-extrabold tracking-tight text-text">{{ copy.completedTitle }}</h1>
  <p class="text-sm text-text-dim">{{ scoreText() }}</p>
  <button
    type="button"
    class="press mt-3 rounded-xl bg-accent px-4 py-2.5 text-sm font-semibold text-accent-ink shadow-btn"
    (click)="back.emit()"
  >
    {{ backText() }}
  </button>
</section>
