<div class="flex flex-col items-start gap-2">
  <button
    type="button"
    class="press rounded-xl px-4 py-2.5 text-sm font-semibold disabled:opacity-50"
    [class]="variantClasses()"
    [disabled]="disabled() || state() === 'preparing'"
    (click)="launch()"
  >
    {{ state() === 'preparing' ? copy.preparing : label() }}
  </button>

  @if (state() === 'empty') {
    <p role="status" class="text-sm text-text-dim">{{ emptyMessage() }}</p>
  }
  @if (state() === 'error') {
    <div role="alert" class="flex flex-wrap items-center gap-x-3 gap-y-1 text-sm">
      <p class="text-danger">{{ errorMessage() }}</p>
      <button
        type="button"
        class="press font-semibold text-accent-text underline-offset-4 hover:underline"
        (click)="launch()"
      >
        {{ copy.retry }}
      </button>
    </div>
  }
</div>
