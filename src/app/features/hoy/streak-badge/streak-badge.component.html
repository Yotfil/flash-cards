@if (label(); as text) {
  <span
    role="img"
    class="inline-flex items-center gap-1.5 rounded-full border border-glass-border bg-surface px-2.5 py-1 text-xs font-semibold text-text-dim"
    [attr.aria-label]="ariaLabel()"
  >
    <app-icon name="flame" size="sm" class="text-accent-text" />
    <span aria-hidden="true">{{ text }}</span>
  </span>
}
