<a
  class="glass-soft press flex items-center gap-3 rounded-2xl p-3"
  [routerLink]="['/biblioteca', pending().bookId]"
>
  <span class="grid size-9 shrink-0 place-items-center rounded-lg bg-accent-tint text-accent-text">
    <app-icon name="books" />
  </span>
  <span class="min-w-0 flex-1">
    <span data-name class="block truncate font-bold text-text">{{ pending().name }}</span>
    <span data-meta class="mt-0.5 block text-xs text-text-faint">{{ meta() }}</span>
  </span>
  <span data-total class="text-lg font-extrabold text-text">{{ total() }}</span>
</a>
